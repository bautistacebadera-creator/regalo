<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0c13">
<title>♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0e0c13;
    --bg-2:#1c1626;
    --accent:#e3a857;
    --accent-rose:#c97b8c;
    --ink:#f4eee3;
    --muted:#847c93;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }

  html,body{
    height:100%;
    margin:0;
    overscroll-behavior:none;
  }

  body{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(28px,6vh,48px);
    background:
      radial-gradient(120% 90% at 50% 30%, var(--bg-2) 0%, var(--bg-1) 60%);
    background-size:140% 140%;
    animation:drift 46s ease-in-out infinite alternate;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden;
  }

  @keyframes drift{
    0%{ background-position:50% 30%; }
    100%{ background-position:50% 55%; }
  }

  .stage{
    position:relative;
    width:min(78vw,340px);
    height:min(78vw,340px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #ring{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  #playBtn{
    position:relative;
    width:34%;
    height:34%;
    min-width:110px;
    min-height:110px;
    border-radius:50%;
    border:1px solid rgba(244,238,227,0.16);
    background:rgba(244,238,227,0.04);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink);
    animation:breathe 3.6s ease-in-out infinite;
    transition:border-color .4s ease, background .4s ease;
  }

  #playBtn:hover{ border-color:rgba(244,238,227,0.32); }

  #playBtn.playing{
    animation:none;
    border-color:rgba(227,168,87,0.45);
    background:rgba(227,168,87,0.06);
  }

  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 0 rgba(227,168,87,0.0); transform:scale(1); }
    50%{ box-shadow:0 0 26px 6px rgba(227,168,87,0.10); transform:scale(1.035); }
  }

  #playBtn svg{ width:30%; height:30%; }
  #iconPause{ display:none; }

  .scrubber{
    width:min(72vw,300px);
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .track{
    position:relative;
    width:100%;
    height:22px;
    display:flex;
    align-items:center;
    cursor:pointer;
    touch-action:none;
  }

  .track::before{
    content:'';
    position:absolute;
    left:0; right:0;
    height:1px;
    background:rgba(244,238,227,0.14);
  }

  .fill{
    position:absolute;
    left:0;
    height:1px;
    width:0%;
    background:var(--accent);
    pointer-events:none;
  }

  .knob{
    position:absolute;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--accent);
    left:0%;
    transform:translateX(-50%);
    pointer-events:none;
    box-shadow:0 0 8px 1px rgba(227,168,87,0.5);
  }

  .time{
    display:flex;
    justify-content:space-between;
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-size:15px;
    letter-spacing:0.02em;
    color:var(--muted);
  }

  @media (prefers-reduced-motion: reduce){
    body{ animation:none; }
    #playBtn{ animation:none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <canvas id="ring" width="360" height="360"></canvas>
    <button id="playBtn" aria-label="Reproducir">
      <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
  </div>

  <div class="scrubber">
    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <div class="knob" id="knob"></div>
    </div>
    <div class="time">
      <span id="cur">0:00</span>
      <span id="dur">0:00</span>
    </div>
  </div>

  <audio id="audio" src="regalo.mp3" preload="auto"></audio>

<script>
  const audio = document.getElementById('audio');
  const btn = document.getElementById('playBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const canvas = document.getElementById('ring');
  const ctx = canvas.getContext('2d');
  const track = document.getElementById('track');
  const fill = document.getElementById('fill');
  const knob = document.getElementById('knob');
  const curEl = document.getElementById('cur');
  const durEl = document.getElementById('dur');

  let audioCtx, analyser, dataArray, source, rafId;
  let isSeeking = false;

  function formatTime(s){
    if(!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  audio.addEventListener('loadedmetadata', () => { durEl.textContent = formatTime(audio.duration); });

  audio.addEventListener('timeupdate', () => {
    if(isSeeking) return;
    const pct = (audio.currentTime/audio.duration)*100 || 0;
    fill.style.width = pct+'%';
    knob.style.left = pct+'%';
    curEl.textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('ended', () => {
    cancelAnimationFrame(rafId);
    ctx.clearRect(0,0,canvas.width,canvas.height);
  });

  function setupAudioGraph(){
    if(audioCtx) return;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.82;
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }catch(e){ console.warn('Web Audio no disponible', e); }
  }

  function togglePlay(){
    setupAudioGraph();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
  }

  audio.addEventListener('play', () => {
    btn.classList.add('playing');
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
    btn.setAttribute('aria-label','Pausar');
    if(analyser) drawActive();
  });

  audio.addEventListener('pause', () => {
    btn.classList.remove('playing');
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
    btn.setAttribute('aria-label','Reproducir');
    cancelAnimationFrame(rafId);
    ctx.clearRect(0,0,canvas.width,canvas.height);
  });

  btn.addEventListener('click', togglePlay);

  const W = canvas.width, H = canvas.height, cx = W/2, cy = H/2, baseR = 100;

  function drawActive(){
    analyser.getByteFrequencyData(dataArray);
    ctx.clearRect(0,0,W,H);
    const bars = dataArray.length;
    for(let i=0;i<bars;i++){
      const value = dataArray[i]/255;
      const angle = (i/bars) * Math.PI * 2 - Math.PI/2;
      const len = 6 + value*50;
      const x1 = cx + Math.cos(angle)*baseR;
      const y1 = cy + Math.sin(angle)*baseR;
      const x2 = cx + Math.cos(angle)*(baseR+len);
      const y2 = cy + Math.sin(angle)*(baseR+len);
      const grad = ctx.createLinearGradient(x1,y1,x2,y2);
      grad.addColorStop(0,'rgba(227,168,87,0.85)');
      grad.addColorStop(1,'rgba(201,123,141,0.10)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
    }
    rafId = requestAnimationFrame(drawActive);
  }

  function seekFromEvent(e){
    const rect = track.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = (clientX - rect.left)/rect.width;
    pct = Math.min(1, Math.max(0, pct));
    fill.style.width = (pct*100)+'%';
    knob.style.left = (pct*100)+'%';
    curEl.textContent = formatTime(pct * (audio.duration||0));
    return pct;
  }

  track.addEventListener('pointerdown', (e) => {
    isSeeking = true;
    seekFromEvent(e);
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', (e) => { if(isSeeking) seekFromEvent(e); });
  track.addEventListener('pointerup', (e) => {
    if(isSeeking){
      const pct = seekFromEvent(e);
      audio.currentTime = pct * (audio.duration||0);
      isSeeking = false;
    }
  });
</script>
</body>
</html>
