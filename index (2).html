<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>♥ para vos ♥</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    height:100%;
    font-family:"Comic Sans MS","Comic Sans","Chalkboard SE",cursive,sans-serif;
  }

  body{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:#000;
  }

  .card{
    position:relative;
    max-width:420px;
    width:100%;
    background:#fff6fa;
    border:6px dashed #a239ff;
    border-radius:14px;
    box-shadow:0 0 40px rgba(255,62,165,0.18), 6px 6px 0 rgba(162,57,255,0.5);
    padding:18px 20px 24px;
  }

  .marquee{
    overflow:hidden;
    white-space:nowrap;
    border:2px solid #000;
    background:#111;
    border-radius:6px;
    padding:6px 0;
    margin-bottom:16px;
  }

  .marquee span{
    display:inline-block;
    padding-left:100%;
    font-weight:bold;
    font-size:14px;
    color:#ff3b3b;
    animation:scroll 12s linear infinite;
  }

  @keyframes scroll{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-100%); }
  }

  .msg{
    text-align:center;
    font-size:22px;
    line-height:1.5;
    color:#c2158a;
    font-weight:bold;
    text-shadow:
      -1.5px -1.5px 0 #fff,
       1.5px -1.5px 0 #fff,
      -1.5px  1.5px 0 #fff,
       1.5px  1.5px 0 #fff,
       3px 3px 0 rgba(162,57,255,0.35);
    margin:6px 0 20px;
  }

  .heart{
    display:block;
    text-align:center;
    font-size:28px;
    color:#e8112d;
    margin:-8px 0 16px;
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.25); }
  }

  .player{
    background:#d8d8e8;
    border:2px solid #000;
    border-radius:10px;
    padding:14px;
  }

  #playBtn{
    display:block;
    margin:0 auto 14px;
    width:120px;
    height:44px;
    font-family:inherit;
    font-weight:bold;
    font-size:15px;
    color:#111;
    background:linear-gradient(180deg,#ffffff 0%,#d9d9f0 45%,#b7b7de 46%,#e6e6f7 100%);
    border:2px solid #000;
    border-radius:8px;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.9), 3px 3px 0 rgba(0,0,0,0.35);
    cursor:pointer;
    letter-spacing:0.5px;
  }
  #playBtn:active{
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.2);
    transform:translate(2px,2px);
  }

  .track{
    position:relative;
    height:18px;
    background:#111;
    border:2px solid #000;
    border-radius:4px;
    cursor:pointer;
    overflow:hidden;
    touch-action:none;
  }

  .fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background:
      repeating-linear-gradient(45deg,#00e5a8 0 8px,#00c98f 8px 16px);
  }

  .time{
    display:flex;
    justify-content:space-between;
    font-family:"Courier New",monospace;
    font-size:12px;
    color:#00e58a;
    background:#111;
    border:2px solid #000;
    border-top:none;
    border-radius:0 0 4px 4px;
    padding:3px 6px;
    letter-spacing:1px;
  }
</style>
</head>
<body>

  <div class="card">


    <div class="marquee"><span>☆.｡.:*・ﾟ★ para zoe :) ★ﾟ・*:.｡.☆ ☆.｡.:*・ﾟ★ para zoe :) ★ﾟ・*:.｡.☆</span></div>

    <p class="msg">perdona q no sepa cantar bn,<br>espero que te guste,<br>te amo :)</p>
    <span class="heart">♥</span>

    <div class="player">
      <button id="playBtn">▶ PLAY</button>
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
      </div>
      <div class="time">
        <span id="cur">0:00</span>
        <span id="dur">0:00</span>
      </div>
    </div>
  </div>

  <audio id="audio" preload="auto">
    <source src="regalo.flac" type="audio/flac">
    <source src="regalo.mp3" type="audio/mpeg">
  </audio>

<script>
  const audio = document.getElementById('audio');
  const btn = document.getElementById('playBtn');
  const track = document.getElementById('track');
  const fill = document.getElementById('fill');
  const curEl = document.getElementById('cur');
  const durEl = document.getElementById('dur');
  let isSeeking = false;

  function formatTime(s){
    if(!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  audio.addEventListener('loadedmetadata', () => { durEl.textContent = formatTime(audio.duration); });

  audio.addEventListener('timeupdate', () => {
    if(isSeeking) return;
    const pct = (audio.currentTime/audio.duration)*100 || 0;
    fill.style.width = pct+'%';
    curEl.textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('play', () => { btn.textContent = '❚❚ PAUSE'; });
  audio.addEventListener('pause', () => { btn.textContent = '▶ PLAY'; });
  audio.addEventListener('ended', () => { btn.textContent = '▶ PLAY'; });

  btn.addEventListener('click', () => {
    if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
  });

  function seekFromEvent(e){
    const rect = track.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = (clientX - rect.left)/rect.width;
    pct = Math.min(1, Math.max(0, pct));
    fill.style.width = (pct*100)+'%';
    curEl.textContent = formatTime(pct * (audio.duration||0));
    return pct;
  }

  track.addEventListener('pointerdown', (e) => {
    isSeeking = true;
    seekFromEvent(e);
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', (e) => { if(isSeeking) seekFromEvent(e); });
  track.addEventListener('pointerup', (e) => {
    if(isSeeking){
      const pct = seekFromEvent(e);
      audio.currentTime = pct * (audio.duration||0);
      isSeeking = false;
    }
  });
</script>
</body>
</html>
